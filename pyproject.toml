[project]
name = "fast-ai"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.17",
    "langchain-core>=1.6.0",
    "langchain-google-genai>=4.3.5",
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.3.1",
    "pgvector",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
]

[tool.fastapi]
entrypoint = "app.main:app"
